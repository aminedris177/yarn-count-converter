<style>

  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px;direction:ltr}
  .seg button{flex:1;padding:10px;font-size:15px;border:0;background:var(--bg);color:var(--ink);cursor:pointer}

      <tbody>
        <tr><td class="lbl soft">Soft TF</td><td id="sTFmin">—</td><td id="sTFmax">—</td><td id="sTFavg">—</td></tr>
        <tr><td class="lbl soft">Soft TPM</td><td id="sTPMmin">—</td><td id="sTPMmax">—</td><td id="sTPMavg">—</td></tr>

      <button id="modeTf" role="radio" aria-checked="false">TF → TPM</button>
    </div>
    <label for="txtTwist" id="lblTwist">Enter Tpm =</label>
    <input id="txtTwist" inputmode="decimal" autocomplete="off" value="0">
    <label style="margin-top:10px" id="lblTwistRes">Result Tf =</label>
    <div class="big" id="twistRes">—</div>

  <footer><button class="btn sec" id="btnShare" data-t="share"></button><br><br>By Eng. Amin Edris 2025 · <span id="ver"></span></footer>

<script>
"use strict";
const APP_VERSION = "1.2.0";

/* ---------- texts ---------- */
const T = {
  ar:{title:"محوّل النمر والبرم",manual:"الدليل",count:"النمرة",value:"النمرة المراد تحويلها",ply:"عدد الطاقات (Ply)",
      from:"من نظام",to:"إلى نظام",fibers:"مراعاة اختلاف كثافة الألياف",fromFiber:"من خامة",toFiber:"إلى خامة",
      results:"النتائج",rReal:"النمرة المحوّلة (طاقة واحدة)",rPly:"النمرة المحوّلة بعدد الطاقات",
      rDens:"النمرة المكافئة بنفس القطر للخامة الجديدة",rWeight:"وزن المتر",rSoftDia:"القطر – برم خفيف (Soft)",
      rHardDia:"القطر – برم شديد (Hard)",twistTable:"حسابات البرم",tSingle:"على النمرة السنجل",tPly:"على النمرة النهائية (مزوي {n} طرف)",twistCalc:"حاسبة البرم",
      offline:"أنت تعمل بدون إنترنت — التطبيق يعمل بشكل طبيعي",errCount:"أدخل النمرة المراد تحويلها",errPly:"عدد الطاقات يجب أن يكون 1 على الأقل",
      noManual:"تعذّر فتح الدليل",install:"تثبيت",share:"مشاركة رابط التطبيق",copied:"تم نسخ الرابط",
      iTitle:"ثبّت التطبيق على موبايلك",iSub:"مرة واحدة بس — بعدها يفتح من الأيقونة ويشتغل من غير نت.",
      iBtn:"ثبّت الآن",later:"لاحقاً",done:"تمام",
      aSteps:["اضغط على <b>⋮</b> فوق على اليمين في Chrome","اختار <b>تثبيت التطبيق</b> أو <b>إضافة إلى الشاشة الرئيسية</b>","اضغط <b>تثبيت</b>"],
      iosSteps:["اضغط زرار المشاركة {share} تحت في Safari","انزل واختار <b>إضافة إلى الشاشة الرئيسية</b> {add}","اضغط <b>إضافة</b> فوق على اليمين"],
      inApp:"إنت فاتح اللينك من جوه تطبيق تاني (واتساب/فيسبوك). افتحه في {b} الأول عشان تقدر تثبّته.",
      inAppIOS:"اضغط على ⋯ أو أيقونة البوصلة واختار <b>Open in Safari</b>.",
      inAppAnd:"اضغط على ⋮ واختار <b>Open in Chrome</b>."},
  en:{title:"Yarn Count Converter",manual:"Read me",count:"Count",value:"Convert from",ply:"Ply (1 = single)",
      from:"From count",to:"To count",fibers:"Considering different fiber densities",fromFiber:"From fiber",toFiber:"To fiber",
      results:"Results",rReal:"Converted (1-ply)",rPly:"Converted (with ply)",
      rDens:"Matching diameter in new fiber",rWeight:"Weight of one meter",rSoftDia:"Soft twist diameter",
      rHardDia:"Hard twist diameter",twistTable:"Twist calculations",tSingle:"on single count",tPly:"on resultant count ({n}-ply)",twistCalc:"Twist calculator",
      offline:"You are offline — the app works normally",errCount:"Enter count to convert",errPly:"Ply must be at least 1.",
      noManual:"Cannot open the manual",install:"Install",share:"Share app link",copied:"Link copied",
      iTitle:"Install the app on your phone",iSub:"One time only — then it opens from its icon and works offline.",
      iBtn:"Install now",later:"Later",done:"OK",
      aSteps:["Tap <b>⋮</b> at the top right in Chrome","Choose <b>Install app</b> or <b>Add to Home screen</b>","Tap <b>Install</b>"],
      iosSteps:["Tap the Share button {share} in Safari","Scroll and choose <b>Add to Home Screen</b> {add}","Tap <b>Add</b> at the top right"],
      inApp:"You opened this link inside another app (WhatsApp/Facebook). Open it in {b} first to install.",
      inAppIOS:"Tap ⋯ or the compass icon and choose <b>Open in Safari</b>.",
      inAppAnd:"Tap ⋮ and choose <b>Open in Chrome</b>."}
};
let lang = "ar";
try { lang = localStorage.getItem("lang") || "ar"; } catch(e){}

/* ---------- .NET-style Math.Round (banker's rounding) ---------- */
function round(x, d){
  d = d || 0;
  const m = Math.pow(10, d), v = x * m, f = Math.floor(v), diff = v - f;
  let r;
  if (Math.abs(diff - 0.5) < 1e-9) r = (f % 2 === 0) ? f : f + 1;
  else r = Math.round(v);
  return r / m;
}
const fmt = n => (Number.isFinite(n) ? String(+n.toFixed(10)) : "—");

/* ---------- conversion logic (ported from Form1.vb) ---------- */
const UNITS  = ["Ne","Nm","Tex","Denier","DTEX","lb","Le"];
const FIBERS = ["PolyProp","Cotton","Wool","Polyester","Acrylic","Nylon","Jute","Linen","Rayon","Silk"];

function convertToTex(v, unit){
  switch(unit.toLowerCase()){
    case "ne": return 590.5 / v;
    case "nm": return 1000 / v;
    case "tex": return v;
    case "denier": return v / 9;
    case "dtex": return v / 10;
    case "le": return (453.592 * 1000) / (v * 274.32);   // lea: 300 yd per lb
    case "lb": return (v * 453.592) / 13.16576;          // jute: lb per 14400 yd
  }
  throw new Error("Unknown unit");
}
function convertFromTex(tex, unit){
  switch(unit.toLowerCase()){
    case "ne": return 590.5 / tex;
    case "nm": return 1000 / tex;
    case "tex": return tex;
    case "denier": return tex * 9;
    case "dtex": return tex * 10;
    case "le": return (453.592 * 1000) / (tex * 274.32);
    case "lb": return (tex * 13.16576) / 453.592;
  }
  throw new Error("Unknown unit");
}
function fiberDensity(f){
  return ({cotton:1.54,wool:1.32,polyester:1.38,acrylic:1.17,nylon:1.14,jute:1.48,linen:1.5,rayon:1.5,silk:1.34,polyprop:0.91})[f.toLowerCase()] || 1.0;
}
function yarnDiameterMM(tex, density){
  if (tex <= 0 || density <= 0) return 0;
  return Math.sqrt((4 * tex) / (Math.PI * density * 1000));
}
function convertToPly(count, unit, ply){
  switch(unit.toLowerCase()){
    case "ne": case "nm": case "le": return count * ply;      // indirect systems
    case "tex": case "denier": case "dtex": case "lb": return count / ply; // direct systems
  }
  throw new Error("Unknown unit");
}
function packingFactor(f){
  switch(f.toLowerCase()){
    case "cotton": case "linen": case "rayon": return [0.65,0.85];
    case "wool": return [0.55,0.7];
    case "polyester": case "silk": return [0.68,0.82];
    case "acrylic": case "nylon": return [0.55,0.9];
    case "jute": return [0.8,0.9];
    case "polyprop": return [0.65,0.8];
  }
  return [1,1];
}

function twistFactorAndTPM(tex, soft, fromUnit){
  let mn = 0, mx = 0;
  if (fromUnit === "Ne"){
    const ne = 590.5 / tex;
    if      (ne <= 1)  [mn,mx] = soft ? [2.8,3.8] : [4,4.5];
    else if (ne <= 6)  [mn,mx] = soft ? [3,3.8]   : [4,4.5];
    else if (ne <= 10) [mn,mx] = soft ? [3.2,4]   : [4.2,4.5];
    else               [mn,mx] = soft ? [3.5,4.2] : [4.3,4.5];   // fixed: Ne > 200 previously gave 0
    const avg = (mn+mx)/2, k = 39.37 * Math.sqrt(ne);
    return {tfAvg:round(avg,1), tpm:round(avg*k,1), tfMin:round(mn,1), tfMax:round(mx,1), tpmMin:round(mn*k,1), tpmMax:round(mx*k,1)};
  }
  if (fromUnit === "Nm"){
    const nm = 1000 / tex;
    if      (nm <= 1)  [mn,mx] = soft ? [40,50] : [60,80];
    else if (nm <= 6)  [mn,mx] = soft ? [50,60] : [70,85];
    else if (nm <= 10) [mn,mx] = soft ? [60,70] : [90,110];
    else               [mn,mx] = soft ? [75,85] : [100,120];     // fixed: Nm > 200 previously gave 0
    const avg = (mn+mx)/2, k = Math.sqrt(nm);
    return {tfAvg:round(avg,2), tpm:round(avg*k,2), tfMin:round(mn,2), tfMax:round(mx,2), tpmMin:round(mn*k,2), tpmMax:round(mx*k,2)};
  }
  const tbl = [ // [upper tex, softMin, softMax, hardMin, hardMax]
    [20,12,20,22,30],[50,10,14,15,25],[100,7,14,15,25],[200,8,11,15,25],[300,7,13,14,25],
    [400,7,12,12,25],[500,7,10,12,25],[600,7,8,12,25],[700,7,8,12,25],[1000,7,8,12,24],
    [1200,7,8,12,24],[1400,6,8,10,20],[1600,6,8,10,20],[Infinity,6,8,10,20] // fixed: 1600–1800 previously gave 0
  ];
  const row = tbl.find(r => tex <= r[0]);
  [mn,mx] = soft ? [row[1],row[2]] : [row[3],row[4]];
  const avg = (mn+mx)/2, s = Math.sqrt(tex);
  return {tfAvg:round(avg,2), tpm:round(avg*100/s,2), tfMin:round(mn,2), tfMax:round(mx,2), tpmMin:round(mn*100/s,2), tpmMax:round(mx*100/s,2)};
}

function twistSpecial(tex, fromUnit, tfMode, input){
  if (fromUnit === "Ne"){
    const ne = 590.5 / tex;
    return tfMode ? round(input*39.37*Math.sqrt(ne),1) : round(input/(39.37*Math.sqrt(ne)),1);
  }
  if (fromUnit === "Nm"){
    const nm = 1000 / tex;
    return tfMode ? round(input*Math.sqrt(nm),1) : round(input/Math.sqrt(nm),1);
  }
  return tfMode ? round(input*100/Math.sqrt(tex),0) : round(input*Math.sqrt(tex)/100,0);
}

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
function fill(sel, items, idx){ sel.innerHTML = items.map(i=>`<option>${i}</option>`).join(""); sel.selectedIndex = idx; }
fill($("cmbFrom"), UNITS, 4); fill($("cmbTo"), UNITS, 3);
fill($("cmbFromFiber"), FIBERS, 0); fill($("cmbToFiber"), FIBERS, 0);
let tfMode = false;

function num(s){
  s = String(s).trim().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[٫,]/g, ".");
  return s === "" ? NaN : Number(s);
}
function tIn(tpm, d){ return `${fmt(tpm)}\n${fmt(round(tpm/39.37, d))} T/in`; }

function clearOut(){
  ["rReal","rPly","rDens","rWeight","rSoftDia","rHardDia","sTFmin","sTFmax","sTFavg","sTPMmin","sTPMmax","sTPMavg",
   "hTFmin","hTFmax","hTFavg","hTPMmin","hTPMmax","hTPMavg","twistRes"].forEach(id => $(id).textContent = "—");
  $("rTitle").textContent = "—"; $("tTitle").textContent = "—"; $("tNote").textContent = "";
}

function compute(){
  const L = T[lang];
  const v = num($("txtValue").value), ply = num($("txtPly").value);
  $("err").textContent = "";
  if (!Number.isFinite(v) || v <= 0){ clearOut(); if ($("txtValue").value.trim() !== "" && $("txtValue").value.trim() !== "0") $("err").textContent = L.errCount; return; }
  if (!Number.isInteger(ply) || ply < 1){ clearOut(); $("err").textContent = L.errPly; return; }

  const from = $("cmbFrom").value, to = $("cmbTo").value;
  const fFib = $("cmbFromFiber").value, tFib = $("cmbToFiber").value;

  const texSingle = convertToTex(v, from);
  const texTotal  = texSingle * ply;
  const result2   = convertFromTex(texTotal, to);
  const dFrom = fiberDensity(fFib), dTo = fiberDensity(tFib);
  const correctedTex = texTotal * (dTo / dFrom);
  const plyC   = convertToPly(result2, to, ply);
  const result = convertFromTex(correctedTex, to);

  $("rTitle").textContent = `${fmt(v)}/${ply} ${from}, ${fFib}  →  ${to}`;
  $("rReal").textContent  = `${fmt(round(result2,1))}/1 ${to}`;
  $("rPly").textContent   = `${fmt(round(plyC,1))}/${ply} ${to}`;
  $("rDens").textContent  = `${fmt(round(result,1))}/1 ${to}, ${tFib}`;
  $("rWeight").textContent= `${fmt(round(texTotal/1000,3))} g/m`;

  const dia = yarnDiameterMM(texTotal, dFrom), pf = packingFactor(fFib);
  $("rSoftDia").textContent = `${fmt(round(dia/pf[0],4))} mm`;
  $("rHardDia").textContent = `${fmt(round(dia/pf[1],4))} mm`;

  // Twist basis: single yarn when ply = 1, resultant (final) count when plied
  const twistTex = ply > 1 ? texTotal : texSingle;
  const s = twistFactorAndTPM(twistTex, true, from), h = twistFactorAndTPM(twistTex, false, from);
  $("tTitle").textContent = ply > 1
    ? `${fmt(v)}/${ply} ${from} = ${fmt(round(convertFromTex(twistTex, from),2))}/1 ${from} — ${L.tPly.replace("{n}", ply)}`
    : `${fmt(v)}/1 ${from} — ${L.tSingle}`;
  $("sTFmin").textContent = fmt(s.tfMin); $("sTFmax").textContent = fmt(s.tfMax); $("sTFavg").textContent = fmt(s.tfAvg);
  $("hTFmin").textContent = fmt(h.tfMin); $("hTFmax").textContent = fmt(h.tfMax); $("hTFavg").textContent = fmt(h.tfAvg);
  if (from === "Ne"){
    $("sTPMmin").textContent = tIn(s.tpmMin,0); $("sTPMmax").textContent = tIn(s.tpmMax,0); $("sTPMavg").textContent = tIn(s.tpm,0);
    $("hTPMmin").textContent = tIn(h.tpmMin,0); $("hTPMmax").textContent = tIn(h.tpmMax,0); $("hTPMavg").textContent = tIn(h.tpm,0);
  } else {
    $("sTPMmin").textContent = fmt(s.tpmMin); $("sTPMmax").textContent = fmt(s.tpmMax); $("sTPMavg").textContent = fmt(s.tpm);
    $("hTPMmin").textContent = fmt(h.tpmMin); $("hTPMmax").textContent = fmt(h.tpmMax); $("hTPMavg").textContent = fmt(h.tpm);
  }
  $("tNote").textContent = from === "Ne" ? "Cotton system: Turns/inch = TPM / 39.37 — twist factor from 2.8 to 4.5"
                        : from === "Nm" ? "Wool system: twist factor from 60 to 120"
                        : "Tex system: twist factor from 8 to 40";

  const tw = num($("txtTwist").value);
  if (!Number.isFinite(tw) || tw === 0){ $("twistRes").textContent = "—"; }
  else {
    const r = twistSpecial(twistTex, from, tfMode, tw);
    $("twistRes").textContent = (from === "Ne" && tfMode) ? `${fmt(r)}  (${fmt(round(r/39.37,1))} T/in)` : fmt(r);
  }
}

function setMode(tf){
  tfMode = tf;
  $("modeTf").classList.toggle("on", tf);  $("modeTf").setAttribute("aria-checked", tf);
  $("modeTpm").classList.toggle("on", !tf); $("modeTpm").setAttribute("aria-checked", !tf);
  $("lblTwist").textContent    = tf ? "Enter Tf =" : "Enter Tpm =";
  $("lblTwistRes").textContent = tf ? "Result Tpm =" : "Result Tf =";
  compute();
}

function applyLang(){
  const L = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = L[el.dataset.t]);
  $("btnLang").textContent = lang === "ar" ? "EN" : "ع";
  document.title = L.title;
  if (window.__instReady) renderInstall();
  compute();
}

["txtValue","txtPly","txtTwist"].forEach(id => $(id).addEventListener("input", compute));
["cmbFrom","cmbTo","cmbFromFiber","cmbToFiber"].forEach(id => $(id).addEventListener("change", compute));
$("txtValue").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); $("txtPly").focus(); }});
$("txtPly").addEventListener("blur", () => { if ($("txtPly").value.trim() === "" || num($("txtPly").value) === 0){ $("txtPly").value = "1"; compute(); }});
$("modeTf").addEventListener("click", () => setMode(true));
$("modeTpm").addEventListener("click", () => setMode(false));
$("btnLang").addEventListener("click", () => { lang = lang === "ar" ? "en" : "ar"; try{ localStorage.setItem("lang", lang); }catch(e){} applyLang(); });
$("btnManual").addEventListener("click", () => { window.open("manual.pdf", "_blank"); });
$("ver").textContent = "v" + APP_VERSION;

function netState(){ document.body.classList.toggle("offline", !navigator.onLine); }
addEventListener("online", netState); addEventListener("offline", netState); netState();

applyLang();

/* ---------- install helper (Android + iPhone) ---------- */
const UA = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isAndroid = /Android/.test(UA);
const isInApp = /FBAN|FBAV|FB_IAB|Instagram|WhatsApp|Line\/|Snapchat|TikTok|; wv\)/.test(UA);
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const SVG_SHARE = '<span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></span>';
const SVG_ADD   = '<span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg></span>';
let deferredPrompt = null, instDismissed = false;
try { instDismissed = sessionStorage.getItem("instLater") === "1"; } catch(e){}

addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; renderInstall(); });
addEventListener("appinstalled", () => { deferredPrompt = null; $("instCard").hidden = true; $("btnInstall").style.display = "none"; });

function renderInstall(force){
  const L = T[lang], card = $("instCard");
  if (isStandalone()){ document.body.classList.add("standalone"); card.hidden = true; return; }
  const mobile = isIOS || isAndroid;
  $("btnInstall").style.display = (mobile || deferredPrompt) ? "inline-block" : "none";
  if ((instDismissed && !force) || !(mobile || deferredPrompt)){ card.hidden = true; return; }
  let body = "";
  if (isInApp){
    body = `<div class="warn">${L.inApp.replace("{b}", isIOS ? "Safari" : "Chrome")}<br>${isIOS ? L.inAppIOS : L.inAppAnd}</div>`;
  } else if (deferredPrompt){
    body = `<div class="row"><button class="btn pri" id="instGo">${L.iBtn}</button><button class="btn sec" id="instLater">${L.later}</button></div>`;
  } else {
    const steps = isIOS ? L.iosSteps : L.aSteps;
    body = `<ol>${steps.map(x => `<li>${x.replace("{share}", SVG_SHARE).replace("{add}", SVG_ADD)}</li>`).join("")}</ol>
            <div class="row"><button class="btn sec" id="instLater">${L.done}</button></div>`;
  }
  card.innerHTML = `<h2>${L.iTitle}</h2><p>${L.iSub}</p>${body}`;
  card.hidden = false;
  const go = $("instGo");
  if (go) go.onclick = async () => { deferredPrompt.prompt(); const r = await deferredPrompt.userChoice; deferredPrompt = null; if (r.outcome === "accepted") card.hidden = true; else renderInstall(true); };
  const later = $("instLater");
  if (later) later.onclick = () => { card.hidden = true; instDismissed = true; try{ sessionStorage.setItem("instLater","1"); }catch(e){} };
}
$("btnInstall").addEventListener("click", () => {
  if (deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.then(() => { deferredPrompt = null; renderInstall(true); }); }
  else { renderInstall(true); scrollTo({top:0, behavior:"smooth"}); }
});
$("btnShare").addEventListener("click", async () => {
  const url = new URL("./", location.href).href;
  try {
    if (navigator.share) await navigator.share({title: T[lang].title, url});
    else { await navigator.clipboard.writeText(url); alert(T[lang].copied); }
  } catch(e){}
});
matchMedia("(display-mode: standalone)").addEventListener?.("change", () => renderInstall());

/* ---------- offline support ---------- */
if ("serviceWorker" in navigator){
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

window.__instReady = true;
renderInstall();

/* expose for tests */
window.__calc = {convertToTex, convertFromTex, twistFactorAndTPM, twistSpecial, round};
</script>
</body>
</html>
