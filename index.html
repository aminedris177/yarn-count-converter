<style>
  :root{
    --bg:#eef2f6; --card:#ffffff; --ink:#1b2430; --muted:#5d6b7a; --line:#d9e1ea;
    --brand:#1f4e79; --brand-ink:#ffffff; --accent:#e8f0f7; --soft:#2e7d32; --hard:#b23c17;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#11161c; --card:#1a222b; --ink:#e6edf3; --muted:#9aa8b6; --line:#2c3743;
      --brand:#3b7dc0; --brand-ink:#ffffff; --accent:#1f2a36; --soft:#6cc070; --hard:#ef8a64; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;
    -webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
  header img{width:34px;height:34px;border-radius:8px;background:#fff}
  header h1{font-size:17px;margin:0;flex:1;line-height:1.2}
  header button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);
    border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
  main{max-width:640px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{font-size:15px;margin:0 0 10px;color:var(--brand)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  input,select{width:100%;font-size:17px;padding:10px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--ink);direction:ltr;text-align:left}
  input:focus,select:focus{outline:2px solid var(--brand);outline-offset:0}
  .res{list-style:none;margin:0;padding:0}
  .res li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .res li:last-child{border-bottom:0}
  .res .k{color:var(--muted)}
  .res .v{font-weight:600;direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
  .head{background:var(--accent);border-radius:10px;padding:10px;font-size:14px;margin-bottom:8px;direction:ltr;text-align:left}
  table{width:100%;border-collapse:collapse;font-size:14px;direction:ltr}
  th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  th{color:var(--muted);font-weight:600;font-size:12px}
  td{white-space:pre-line;line-height:1.35}
  td.lbl{text-align:left;font-weight:600}
  .soft{color:var(--soft)} .hard{color:var(--hard)}
  .note{font-size:12px;color:var(--muted);margin-top:8px;direction:ltr;text-align:left}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px;direction:ltr}
  .seg button{flex:1;padding:10px;font-size:15px;border:0;background:var(--bg);color:var(--ink);cursor:pointer}
  .seg button.on{background:var(--brand);color:#fff}
  .big{font-size:22px;font-weight:700;direction:ltr;text-align:left;padding:8px 2px;min-height:40px}
  .err{color:var(--hard);font-size:13px;min-height:18px;margin-top:6px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:8px}
  .off{display:none;background:#fff4d6;color:#6b4e00;font-size:12px;text-align:center;padding:4px}
  body.offline .off{display:block}
  [dir=ltr] .res .v,[dir=ltr] input{text-align:left}
  /* twist section */
  #cmbYarn,#cusSys,#cmbRatio{direction:inherit;text-align:start;font-size:16px}
  .tf{font-size:24px;font-weight:700;color:var(--brand);direction:ltr;text-align:left;margin:12px 0 2px}
  .tf small{font-size:14px;color:var(--muted);font-weight:600}
  .eq{font-size:13px;color:var(--muted);direction:ltr;text-align:left;margin-bottom:10px}
  .ev{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:8px}
  .ev.strong{background:#e3f4e5;color:#1e6b2a} .ev.medium{background:#fff1d6;color:#7a5200} .ev.weak{background:#fde4dc;color:#9a2f12}
  #cmbRatio:disabled{opacity:.55}
  #tTitle,#tNote{direction:inherit;text-align:start}
  .warn2{background:#fff4d6;color:#6b4e00;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px}
  .btn.copy{width:100%;background:var(--brand);color:#fff;font-size:16px;padding:14px;margin-bottom:12px}
  /* install helper */
  .inst{background:var(--card);border:2px solid var(--brand);border-radius:14px;padding:14px;margin-bottom:12px}
  .inst h2{margin:0 0 6px;font-size:16px;color:var(--brand)}
  .inst p{margin:0 0 10px;font-size:14px;color:var(--muted)}
  .inst ol{margin:0 0 10px;padding-inline-start:22px;font-size:15px;line-height:1.9}
  .inst .ic{display:inline-flex;vertical-align:middle;width:26px;height:26px;border-radius:6px;background:var(--accent);
    align-items:center;justify-content:center;margin:0 3px}
  .inst .ic svg{width:18px;height:18px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .inst .row{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer}
  .btn.pri{background:var(--brand);color:#fff;flex:1}
  .btn.sec{background:var(--accent);color:var(--ink)}
  .warn{background:#fff4d6;color:#6b4e00;border-radius:10px;padding:10px;font-size:14px;margin-bottom:10px}
  body.standalone .inst, body.standalone #btnInstall{display:none!important}
  #btnInstall{display:none}
  .toast{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;max-width:616px;margin:0 auto;
    background:var(--brand);color:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3);
    display:flex;gap:12px;align-items:center}
  .toast[hidden]{display:none}
  .toast .msg{flex:1;font-size:14px;line-height:1.5}
  .toast .msg b{display:block;font-size:15px}
  .toast button{border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;background:#f5b544;color:#0a2240}
  .toast button.x{background:transparent;color:#fff;font-size:20px;padding:6px 8px}

<header>
  <img src="icon-192.png" alt="">

  <button id="btnInstall" data-t="install"></button>
  <button id="btnManual" data-t="manual"></button>
  <button id="btnLang">EN</button>
</header>
<div class="off" data-t="offline"></div>
<main>
  <section class="inst" id="instCard" hidden></section>
  <section class="card">
    <h2 data-t="count"></h2>
    <div class="grid">
      <div><label for="txtValue" data-t="value"></label><input id="txtValue" inputmode="decimal" autocomplete="off" placeholder="0"></div>
      <div><label for="txtPly" data-t="ply"></label><input id="txtPly" inputmode="numeric" autocomplete="off" value="1"></div>
      <div><label for="cmbFrom" data-t="from"></label><select id="cmbFrom"></select></div>
      <div><label for="cmbTo" data-t="to"></label><select id="cmbTo"></select></div>
    </div>
    <div class="err" id="err"></div>
  </section>

  <section class="card">
    <h2 data-t="fibers"></h2>
    <div class="grid">
      <div><label for="cmbFromFiber" data-t="fromFiber"></label><select id="cmbFromFiber"></select></div>
      <div><label for="cmbToFiber" data-t="toFiber"></label><select id="cmbToFiber"></select></div>
    </div>
  </section>

  <section class="card">
    <h2 data-t="results"></h2>
    <div class="head" id="rTitle">—</div>
    <ul class="res">
      <li><span class="k" data-t="rReal"></span><span class="v" id="rReal">—</span></li>
      <li><span class="k" data-t="rPly"></span><span class="v" id="rPly">—</span></li>
      <li><span class="k" data-t="rDens"></span><span class="v" id="rDens">—</span></li>
      <li><span class="k" data-t="rWeight"></span><span class="v" id="rWeight">—</span></li>
      <li><span class="k" data-t="rSoftDia"></span><span class="v" id="rSoftDia">—</span></li>
      <li><span class="k" data-t="rHardDia"></span><span class="v" id="rHardDia">—</span></li>
    </ul>
  </section>

  <section class="card">
    <h2 data-t="twistTable"></h2>
    <label for="cmbYarn" data-t="yarnType"></label>
    <select id="cmbYarn"></select>
    <div id="customBox" hidden>
      <div class="grid" style="margin-top:10px">
        <div><label for="cusSys" data-t="cusSys"></label><select id="cusSys"><option value="e">αe (Ne)</option><option value="m">αm (Nm)</option><option value="tex">αtex (ISO)</option></select></div>
        <div></div>
        <div><label for="cusMin" data-t="cusMin"></label><input id="cusMin" inputmode="decimal" autocomplete="off"></div>
        <div><label for="cusMax" data-t="cusMax"></label><input id="cusMax" inputmode="decimal" autocomplete="off"></div>
      </div>
    </div>
    <div class="warn2" id="fiberWarn" hidden></div>
    <div class="tf" id="tfMain">—</div>
    <div class="eq" id="tfEq"></div>
    <div class="head" id="tTitle">—</div>
    <table>
      <thead><tr><th></th><th>Min</th><th>Avg</th><th>Max</th></tr></thead>
      <tbody id="tBody"></tbody>
    </table>
    <div id="ratioBox" style="margin-top:12px">
      <label for="cmbRatio" data-t="ratioLbl"></label>
      <select id="cmbRatio"></select>
      <div id="ratioCusBox" hidden style="margin-top:8px"><input id="ratioCus" inputmode="decimal" autocomplete="off" placeholder="0.70"></div>
      <div class="note" id="ratioHint" style="direction:inherit;text-align:start"></div>
    </div>
    <div class="note" id="tNote"></div>
    <span class="ev" id="tEv" hidden></span>
  </section>

  <section class="card">
    <h2 data-t="twistCalc"></h2>
    <div class="seg" role="radiogroup">
      <button id="modeTpm" class="on" role="radio" aria-checked="true">TPM → TF</button>
      <button id="modeTf" role="radio" aria-checked="false">TF → TPM</button>
    </div>
    <label for="txtTwist" id="lblTwist">Enter Tpm =</label>
    <input id="txtTwist" inputmode="decimal" autocomplete="off" value="0">
    <label style="margin-top:10px" id="lblTwistRes">Result Tf =</label>
    <div class="big" id="twistRes">—</div>
    <div class="eq" id="twistEq"></div>
  </section>

  <button class="btn copy" id="btnCopy" data-t="copyBtn"></button>

  <div class="toast" id="toast" hidden></div>
  <footer><button class="btn sec" id="btnShare" data-t="share"></button><br><br>By Eng. Amin Edris 2025 · <span id="ver"></span></footer>
</main>

/* ---------- .NET-style Math.Round (banker's rounding) ---------- */
function round(x, d){
  d = d || 0;
  const m = Math.pow(10, d), v = x * m, f = Math.floor(v), diff = v - f;
  let r;
  if (Math.abs(diff - 0.5) < 1e-9) r = (f % 2 === 0) ? f : f + 1;
  else r = Math.round(v);
  return r / m;
}

/* ---------- conversion logic (ported from Form1.vb) ---------- */
const UNITS  = ["Ne","Nm","Tex","Denier","DTEX","lb","Le"];
const FIBERS = ["PolyProp","Cotton","Wool","Polyester","Acrylic","Nylon","Jute","Linen","Rayon","Silk"];

function convertToTex(v, unit){
  switch(unit.toLowerCase()){
    case "ne": return 590.5 / v;
    case "nm": return 1000 / v;
    case "tex": return v;
    case "denier": return v / 9;
    case "dtex": return v / 10;
    case "le": return (453.592 * 1000) / (v * 274.32);   // lea: 300 yd per lb
    case "lb": return (v * 453.592) / 13.16576;          // jute: lb per 14400 yd
  }
  throw new Error("Unknown unit");
}
function convertFromTex(tex, unit){
  switch(unit.toLowerCase()){
    case "ne": return 590.5 / tex;
    case "nm": return 1000 / tex;
    case "tex": return tex;
    case "denier": return tex * 9;
    case "dtex": return tex * 10;
    case "le": return (453.592 * 1000) / (tex * 274.32);
    case "lb": return (tex * 13.16576) / 453.592;
  }
  throw new Error("Unknown unit");
}
function fiberDensity(f){
  return ({cotton:1.54,wool:1.32,polyester:1.38,acrylic:1.17,nylon:1.14,jute:1.48,linen:1.5,rayon:1.5,silk:1.34,polyprop:0.91})[f.toLowerCase()] || 1.0;
}
function yarnDiameterMM(tex, density){
  if (tex <= 0 || density <= 0) return 0;
  return Math.sqrt((4 * tex) / (Math.PI * density * 1000));
}
function convertToPly(count, unit, ply){
  switch(unit.toLowerCase()){
    case "ne": case "nm": case "le": return count * ply;      // indirect systems
    case "tex": case "denier": case "dtex": case "lb": return count / ply; // direct systems
  }
  throw new Error("Unknown unit");
}
function packingFactor(f){
  switch(f.toLowerCase()){
    case "cotton": case "linen": case "rayon": return [0.65,0.85];
    case "wool": return [0.55,0.7];
    case "polyester": case "silk": return [0.68,0.82];
    case "acrylic": case "nylon": return [0.55,0.9];
    case "jute": return [0.8,0.9];
    case "polyprop": return [0.65,0.8];
  }
  return [1,1];
}

const AE_M   = 39.37 / Math.sqrt(1000 / 590.5);

const tpmFromAe = (ae, tex) => ae * AE_TEX / Math.sqrt(tex);

function sysName(sys){ return sys === "m" ? "αm" : sys === "tex" ? "αtex" : "αe"; }
function sysDec(sys){ return sys === "m" ? 1 : sys === "tex" ? 0 : 2; }

/* returns the twist result for a yarn type on a given tex basis */
function twistForType(y, tex, custom){
  let ae = y.ae, sys = y.sys;
  if (y.id === "custom"){
    if (!custom || !(custom.min > 0) || !(custom.max > 0)) return null;
    sys = custom.sys;
    ae = [sysToAe(Math.min(custom.min,custom.max), sys), sysToAe(Math.max(custom.min,custom.max), sys)];
  }
  const aeAvg = (ae[0] + ae[1]) / 2;
  const tpm = [tpmFromAe(ae[0], tex), tpmFromAe(aeAvg, tex), tpmFromAe(ae[1], tex)];
  return {ae:[ae[0], aeAvg, ae[1]], sys, tpm, tpi: tpm.map(t => t / 39.37)};
}

  const d = sysDec(r.sys);
  return `${sysName(r.sys)} ${nf(aeToSys(a[0],r.sys),d)} – ${nf(aeToSys(a[2],r.sys),d)} <small>(${L.avg} ${nf(aeToSys(a[1],r.sys),d)})</small>`;
}

  if (r.sys === "jute") return `K ${nf(kJute(a[0]),1)}–${nf(kJute(a[2]),1)}`;
  const d = sysDec(r.sys);
  return `${sysName(r.sys)} ${nf(aeToSys(a[0],r.sys),d)}–${nf(aeToSys(a[2],r.sys),d)}`;
}

  $("rWeight").textContent= `${fmt(round(texTotal/1000,3))} g/m`;

    : (ply > 1 ? L.bSinglePly.replace("{c}", iso(cSingle)).replace("{r}", iso(cRes)) : L.bSingle.replace("{c}", iso(cSingle))));

  } else {
    $("tfMain").innerHTML = primaryText(r, L);
    $("tfEq").textContent = `${L.eqL}: ${eqText(r)}`;
    const row = (lbl, a, d) => `<tr><td class="lbl">${lbl}</td>${a.map(x => `<td>${nf(x,d)}</td>`).join("")}</tr>`;
    let html = row("TPM", r.tpm, 0) + row("T/in", r.tpi, 1);
    if (showRatio){
      // ratio = ply twist ÷ singles twist. auto = per yarn type (or per fiber for "custom"), a preset, or the user's own number
      const sel = $("cmbRatio").value;
      let rr = null, rsrc = "", rkind = "ref";
      if (sel === "auto"){ const a = autoRatio(y, fFib); if (a){ rr = a.r; rsrc = a.kind === "sug" ? L.sugTag : a.src; rkind = a.kind; } }
      else if (sel === "custom"){ const c = num($("ratioCus").value); if (c > 0) { rr = [c,c]; rsrc = L.rCustom; rkind = "own"; } }
      else { const o = RATIOS.find(x => x.id === sel); rr = o.r; rsrc = o.kind === "sug" ? L.sugTag : o.src; rkind = o.kind; }
      if (rr){
        const fixed = rr[0] === rr[1];
        const isoN = t => "\u2066" + t + "\u2069";
        if (y.basis === "single"){
          // singles twist known -> suggested ply twist = singles × ratio
          plyTpm = fixed ? r.tpm.map(t => t * rr[0]) : [r.tpm[1]*rr[0], r.tpm[1]*(rr[0]+rr[1])/2, r.tpm[1]*rr[1]];
          plyLabel = L.plyRow;
          notes.push(fixed ? L.plyFixed.replace("{a}", isoN(rr[0])).replace("{src}", isoN(rsrc)) : L.plyNote.replace("{a}–{b}", isoN(rTxt(rr))));
        } else {
          // ply (resultant) twist known -> suggested singles twist = ply ÷ ratio
          plyTpm = fixed ? r.tpm.map(t => t / rr[0]) : [r.tpm[1]/rr[1], r.tpm[1]/((rr[0]+rr[1])/2), r.tpm[1]/rr[0]];
          plyLabel = L.singRow;
          notes.push(fixed ? L.singFixed.replace("{a}", isoN(rr[0])).replace("{src}", isoN(rsrc)) : L.singRange.replace("{a}", isoN(rTxt(rr))));
        }
        plyRatio = rr;
        html += `<tr><td class="lbl soft">${plyLabel}<br><small>TPM</small></td>${plyTpm.map(x => `<td class="soft">${nf(x,0)}</td>`).join("")}</tr>`;
        html += `<tr><td class="lbl soft"><small>T/in</small></td>${plyTpm.map(x => `<td class="soft">${nf(x/39.37,1)}</td>`).join("")}</tr>`;
        if (rkind === "sug") $("ratioHint").textContent = L.sugWarn;
      } else notes.push(L.plyNone);
    }
    $("tBody").innerHTML = html;
  }
  if (y.src) notes.push("📚 \u2066" + y.src + "\u2069");
  notes.push(L.guide);
  $("tNote").textContent = notes.join("  ·  ");

  /* ---- calculator ---- */
  const cSys = r ? (r.sys === "tpi" || r.sys === "jute" ? "tex" : r.sys) : (y.id === "custom" ? custom.sys : "e");
  const nm = sysName(cSys);
  $("lblTwist").textContent    = tfMode ? `Enter ${nm} =` : "Enter TPM =";
  $("lblTwistRes").textContent = tfMode ? "Result TPM =" : `Result ${nm} =`;
  const tw = num($("txtTwist").value);
  let calcTxt = null;
  $("twistEq").textContent = "";
  if (!Number.isFinite(tw) || tw === 0){ $("twistRes").textContent = "—"; }
  else if (tfMode){
    const tpm = tpmFromAe(sysToAe(tw, cSys), basisTex);
    $("twistRes").textContent = `${nf(tpm,0)} TPM`;
    $("twistEq").textContent = `${nf(tpm/39.37,1)} T/in`;
    calcTxt = `${nm} ${fmt(tw)} → ${nf(tpm,0)} TPM (${nf(tpm/39.37,1)} T/in)`;
  } else {
    const ae = aeFromTpm(tw, basisTex);
    $("twistRes").textContent = `${nm} ${nf(aeToSys(ae, cSys), sysDec(cSys))}`;
    $("twistEq").textContent = `αe ${nf(ae,2)} · αm ${nf(ae*AE_M,1)} · αtex ${nf(ae*AE_TEX,0)}`;
    calcTxt = `${fmt(tw)} TPM → αe ${nf(ae,2)} · αm ${nf(ae*AE_M,1)} · αtex ${nf(ae*AE_TEX,0)}`;
  }

  lastOut = {from, to, fFib, tFib, v, ply,
    real:$("rReal").textContent, plyC:$("rPly").textContent, dens:$("rDens").textContent, weight:$("rWeight").textContent,
    soft:$("rSoftDia").textContent, hard:$("rHardDia").textContent,
    yName: y.id === "custom" ? T[lang].custom : y[lang], basisTxt, r, plyTpm, plyRatio, plyLabel, calcTxt};
}

function buildCopyText(){
  const L = T[lang], o = lastOut;
  if (!o) return null;
  const line = "━━━━━━━━━━━━━━━━";
  const out = [`🧵 ${L.title}`, line,
    `${L.cCount}: ${fmt(o.v)}/${o.ply} ${o.from} · ${o.fFib}`,
    `${L.cTo}: ${o.to} · ${o.tFib}`, "",
    `📐 ${L.cConv}`,
    `• ${L.rReal}: ${o.real}`,
    `• ${L.rPly}: ${o.plyC}`,
    `• ${L.rDens}: ${o.dens}`,
    `• ${L.rWeight}: ${o.weight}`,
    `• ${L.rSoftDia}: ${o.soft}`,
    `• ${L.rHardDia}: ${o.hard}`, ""];
  if (o.r){
    out.push(`🌀 ${L.cTwist}: ${o.yName} (${primaryPlain(o.r)})`);
    out.push(`• ${o.basisTxt}`);
    out.push(`• TPM: ${nf(o.r.tpm[0],0)} / ${nf(o.r.tpm[1],0)} / ${nf(o.r.tpm[2],0)}  (T/in ${nf(o.r.tpi[0],1)} / ${nf(o.r.tpi[1],1)} / ${nf(o.r.tpi[2],1)})`);
    if (o.plyTpm) out.push(`• ${o.plyLabel} (${rTxt(o.plyRatio)}): ${nf(o.plyTpm[0],0)} / ${nf(o.plyTpm[1],0)} / ${nf(o.plyTpm[2],0)} TPM`);
    out.push(`• ${L.eqL}: ${eqText(o.r)}`);
  } else out.push(`🌀 ${L.cTwist}: ${o.yName}`);
  if (o.calcTxt) out.push(`• ${L.cCalc}: ${o.calcTxt}`);
  out.push(line, `${new URL("./", location.href).href} · v${APP_VERSION}`);
  return out.join("\n");
}
async function copyResults(){
  const L = T[lang], txt = buildCopyText();
  if (!txt){ showToast(`<b>${L.errCount}</b>`); return; }
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch(e){}
  if (!ok){
    try {
      const ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove();
    } catch(e){}
  }
  showToast(`<b>${ok ? "✓ " + L.copiedRes : L.copyFail}</b>`);
  if (ok) setTimeout(() => { $("toast").hidden = true; }, 2500);
}

function setMode(tf){
  tfMode = tf;
  $("modeTf").classList.toggle("on", tf);  $("modeTf").setAttribute("aria-checked", tf);
  $("modeTpm").classList.toggle("on", !tf); $("modeTpm").setAttribute("aria-checked", !tf);
  compute();
}

function applyLang(){
  const L = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = L[el.dataset.t]);
  $("btnLang").textContent = lang === "ar" ? "EN" : "ع";
  document.title = L.title;
  fillYarns();
  if (window.__instReady) renderInstall();
  compute();
}

["txtValue","txtPly","txtTwist"].forEach(id => $(id).addEventListener("input", compute));
["cmbFrom","cmbTo","cmbToFiber"].forEach(id => $(id).addEventListener("change", compute));
$("cmbFromFiber").addEventListener("change", () => { yarnUserPicked = false; autoYarn(); compute(); });
$("cmbYarn").addEventListener("change", () => { yarnUserPicked = true; compute(); });
function saveCustom(){ try { localStorage.setItem("customTF", JSON.stringify({sys:$("cusSys").value, min:$("cusMin").value, max:$("cusMax").value})); } catch(e){} }
["cusMin","cusMax"].forEach(id => $(id).addEventListener("input", () => { saveCustom(); compute(); }));
$("cusSys").addEventListener("change", () => { saveCustom(); compute(); });
$("btnCopy").addEventListener("click", copyResults);
$("cmbRatio").addEventListener("change", compute);
$("ratioCus").addEventListener("input", () => { try { localStorage.setItem("ratioCus", $("ratioCus").value); } catch(e){} compute(); });
$("txtValue").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); $("txtPly").focus(); }});
$("txtPly").addEventListener("blur", () => { if ($("txtPly").value.trim() === "" || num($("txtPly").value) === 0){ $("txtPly").value = "1"; compute(); }});
$("modeTf").addEventListener("click", () => setMode(true));
$("modeTpm").addEventListener("click", () => setMode(false));
$("btnLang").addEventListener("click", () => { lang = lang === "ar" ? "en" : "ar"; try{ localStorage.setItem("lang", lang); }catch(e){} applyLang(); });
$("btnManual").addEventListener("click", () => { window.open("manual.pdf", "_blank"); });
$("ver").textContent = "v" + APP_VERSION;

function netState(){ document.body.classList.toggle("offline", !navigator.onLine); }
addEventListener("online", netState); addEventListener("offline", netState); netState();

applyLang();

/* ---------- install helper (Android + iPhone) ---------- */
const UA = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isAndroid = /Android/.test(UA);
const isInApp = /FBAN|FBAV|FB_IAB|Instagram|WhatsApp|Line\/|Snapchat|TikTok|; wv\)/.test(UA);
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const SVG_SHARE = '<span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></span>';
const SVG_ADD   = '<span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg></span>';
let deferredPrompt = null, instDismissed = false;
try { instDismissed = sessionStorage.getItem("instLater") === "1"; } catch(e){}

addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; renderInstall(); });
addEventListener("appinstalled", () => { deferredPrompt = null; $("instCard").hidden = true; $("btnInstall").style.display = "none"; });

function renderInstall(force){
  const L = T[lang], card = $("instCard");
  if (isStandalone()){ document.body.classList.add("standalone"); card.hidden = true; return; }
  const mobile = isIOS || isAndroid;
  $("btnInstall").style.display = (mobile || deferredPrompt) ? "inline-block" : "none";
  if ((instDismissed && !force) || !(mobile || deferredPrompt)){ card.hidden = true; return; }
  let body = "";
  if (isInApp){
    body = `<div class="warn">${L.inApp.replace("{b}", isIOS ? "Safari" : "Chrome")}<br>${isIOS ? L.inAppIOS : L.inAppAnd}</div>`;
  } else if (deferredPrompt){
    body = `<div class="row"><button class="btn pri" id="instGo">${L.iBtn}</button><button class="btn sec" id="instLater">${L.later}</button></div>`;
  } else {
    const steps = isIOS ? L.iosSteps : L.aSteps;
    body = `<ol>${steps.map(x => `<li>${x.replace("{share}", SVG_SHARE).replace("{add}", SVG_ADD)}</li>`).join("")}</ol>
            <div class="row"><button class="btn sec" id="instLater">${L.done}</button></div>`;
  }
  card.innerHTML = `<h2>${L.iTitle}</h2><p>${L.iSub}</p>${body}`;
  card.hidden = false;
  const go = $("instGo");
  if (go) go.onclick = async () => { deferredPrompt.prompt(); const r = await deferredPrompt.userChoice; deferredPrompt = null; if (r.outcome === "accepted") card.hidden = true; else renderInstall(true); };
  const later = $("instLater");
  if (later) later.onclick = () => { card.hidden = true; instDismissed = true; try{ sessionStorage.setItem("instLater","1"); }catch(e){} };
}
$("btnInstall").addEventListener("click", () => {
  if (deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.then(() => { deferredPrompt = null; renderInstall(true); }); }
  else { renderInstall(true); scrollTo({top:0, behavior:"smooth"}); }
});
$("btnShare").addEventListener("click", async () => {
  const url = new URL("./", location.href).href;
  try {
    if (navigator.share) await navigator.share({title: T[lang].title, url});
    else { await navigator.clipboard.writeText(url); alert(T[lang].copied); }
  } catch(e){}
});
matchMedia("(display-mode: standalone)").addEventListener?.("change", () => renderInstall());

/* ---------- offline support ---------- */
function showToast(html, btnText, onBtn){
  const t = $("toast");
  t.innerHTML = `<div class="msg">${html}</div>` + (btnText ? `<button id="toastBtn">${btnText}</button>` : "") + `<button class="x" id="toastX" aria-label="close">×</button>`;
  t.hidden = false;
  if (btnText) $("toastBtn").onclick = onBtn;
  $("toastX").onclick = () => { t.hidden = true; };
}

/* After an update: show "Updated to vX" + what's new, once */
(function(){
  let last = null;
  try { last = localStorage.getItem("appVersion"); localStorage.setItem("appVersion", APP_VERSION); } catch(e){}
  const wasCached = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
  if (last !== APP_VERSION && (last || wasCached)){
    const note = CHANGELOG[APP_VERSION] ? CHANGELOG[APP_VERSION][lang] : "";
    showToast(`<b>✓ ${T[lang].updDone.replace("{v}", APP_VERSION)}</b>${note}`);
  }
})();

if ("serviceWorker" in navigator){
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  // A new version took over in the background -> offer to load it now
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloading) return;   // first install, not an update
    // if the version that just took over is the one already on screen, there is nothing new to load
    const sw = navigator.serviceWorker.controller;
    if (!sw) return;
    const ch = new MessageChannel();
    ch.port1.onmessage = e => {
      if (e.data === "count-converter-v" + APP_VERSION) return;
      showToast(`<b>${T[lang].updReady}</b>`, T[lang].updBtn, () => { reloading = true; location.reload(); });
    };
    sw.postMessage("GET_VERSION", [ch.port2]);
  });
  addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      // check for updates on every launch and whenever the app comes back to the screen
      const check = () => reg.update().catch(()=>{});
      check();
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
    }).catch(()=>{});
  });
}

window.__instReady = true;
renderInstall();
autoYarn(); compute();

/* expose for tests */
window.__calc = {convertToTex, convertFromTex, twistForType, YARNS, AE_TEX, AE_M, kJute, round, buildCopyText};
</script>
</body>
</html>
